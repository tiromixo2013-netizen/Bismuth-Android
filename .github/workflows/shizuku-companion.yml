name: Build Bismuth Companion APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/shizuku-companion-telemetry
  pull_request:
    paths:
      - 'companion/**'
      - '.github/workflows/shizuku-companion.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Companion debug APK
        working-directory: companion
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bismuth-companion-debug
          path: companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
