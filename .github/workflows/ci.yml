name: Build and test
on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Validate GLES compute shaders
        run: |
          for shader in shaders/*.comp; do glslangValidator -S comp "$shader"; done
      - name: Configure host tests
        run: cmake -S . -B build -DBISMUTH_BUILD_TESTS=ON
      - name: Build host reference
        run: cmake --build build --parallel
      - name: Run host tests
        run: ctest --test-dir build --output-on-failure
      - name: Test Android APK injection helper
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install exact Android NDK revision
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Verify exact Android NDK revision
        run: grep -q '^Pkg.Revision = 27.2.12479018$' "$ANDROID_NDK_HOME/source.properties"
      - name: Configure Android ARM64 GLES 3.1 backend
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DBISMUTH_ENABLE_GLES31=ON
          -DBISMUTH_ENABLE_ATRACE=ON
          -DBISMUTH_BUILD_TESTS=OFF
      - name: Build Android ARM64 shared library
        run: cmake --build build-android --parallel
      - name: Configure experimental patched-Dobby ARM64 build
        run: >-
          cmake -S . -B build-android-dobby
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DBISMUTH_ENABLE_GLES31=ON
          -DBISMUTH_ENABLE_COCOS_HOOKS=ON
          -DBISMUTH_ENABLE_ATRACE=OFF
          -DBISMUTH_BUILD_TESTS=OFF
      - name: Verify pinned Dobby source patch was applied
        run: |
          grep -Fq 'build routing failed before target patch' build-android-dobby/_deps/dobby-src/source/InterceptRouting/InlineHookRouting.h
          grep -Fq 'if (!trampoline)' build-android-dobby/_deps/dobby-src/source/InterceptRouting/InterceptRouting.h
          grep -Fq 'Do not write any target bytes unless every page is writable.' build-android-dobby/_deps/dobby-src/source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc
          grep -Fq 'hook remains registered' build-android-dobby/_deps/dobby-src/source/dobby.cpp
      - name: Build patched Dobby ARM64 native library
        run: cmake --build build-android-dobby --parallel
      - name: Verify embedded shader matches source validation logic
        run: |
          grep -Fq 'bool validBounds = all(not(isnan(b)))' build-android/generated/embedded_shaders.hpp
          grep -Fq 'bool validView = all(not(isnan(uView)))' build-android/generated/embedded_shaders.hpp
          grep -Fq 'visible = uint(!validBounds || !validView || overlaps)' build-android/generated/embedded_shaders.hpp
      - name: Verify ARM64 ELF and exported C API
        run: |
          file build-android/libbismuth.so
          readelf -h build-android/libbismuth.so | grep -E 'Class:|Machine:'
          readelf -h build-android/libbismuth.so | grep -q 'Class:.*ELF64'
          readelf -h build-android/libbismuth.so | grep -q 'Machine:.*AArch64'
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only build-android/libbismuth.so | tee exported-symbols.txt
          grep -q 'bismuth_android_build_id' exported-symbols.txt
          grep -q 'bismuth_android_capabilities' exported-symbols.txt
          grep -q 'bismuth_create' exported-symbols.txt
          grep -q 'bismuth_initialize' exported-symbols.txt
          grep -q 'bismuth_is_initialized' exported-symbols.txt
          grep -q 'bismuth_upload' exported-symbols.txt
          grep -q 'bismuth_dispatch' exported-symbols.txt
          grep -q 'bismuth_visible_index_buffer' exported-symbols.txt
          grep -q 'bismuth_indirect_command_buffer' exported-symbols.txt
          grep -q 'bismuth_indexed_command_buffer' exported-symbols.txt
          grep -q 'bismuth_atlas_element_index_buffer' exported-symbols.txt
          grep -q 'bismuth_observer_begin_frame' exported-symbols.txt
          grep -q 'bismuth_observer_record_frame_start' exported-symbols.txt
          grep -q 'bismuth_observer_record_batch_draw' exported-symbols.txt
          grep -q 'bismuth_observer_record_sprite_transform' exported-symbols.txt
          grep -q 'bismuth_observer_record_quad_write' exported-symbols.txt
          grep -q 'bismuth_observer_record_structural_mutation' exported-symbols.txt
          grep -q 'bismuth_observer_record_dirty_upload' exported-symbols.txt
          grep -q 'bismuth_observer_invalidate_unknown_mutation' exported-symbols.txt
          grep -q 'bismuth_observer_snapshot' exported-symbols.txt
          grep -q 'bismuth_install_cocos_hooks' exported-symbols.txt
          grep -q 'bismuth_set_passive_telemetry_enabled' exported-symbols.txt
          grep -q 'bismuth_is_passive_telemetry_enabled' exported-symbols.txt
          grep -q 'bismuth_set_gpu_timing_enabled' exported-symbols.txt
          grep -q 'bismuth_is_gpu_timing_enabled' exported-symbols.txt
          grep -q 'bismuth_is_gpu_timing_supported' exported-symbols.txt
          grep -q 'bismuth_gpu_timing_snapshot' exported-symbols.txt
          grep -q 'bismuth_auto_hook_status' exported-symbols.txt
          grep -q 'bismuth_auto_hook_error' exported-symbols.txt
          grep -q 'bismuth_destroy' exported-symbols.txt
      - name: Upload Android ARM64 library
        uses: actions/upload-artifact@v4
        with:
          name: bismuth-android-arm64
          path: build-android/libbismuth.so
          if-no-files-found: error
          retention-days: 14
